# Consumer workload using attested key release (Layer 3) instead of a
# Kubernetes Secret for the decryption key:
#
# - runtimeClassName selects the kata-qemu-coco-dev runtime class
#   installed by scripts/deploy_coco_kbs.sh, so this pod runs inside a
#   Kata/CoCo confidential VM instead of a regular container.
# - The io.katacontainers.config.hypervisor.kernel_params annotation passes
#   agent.aa_kbc_params=cc_kbc::<KBS URL> on the guest kernel command line,
#   telling the in-guest attestation agent which KBS to attest against.
#   (The io.katacontainers.config.agent.aa_kbc_params annotation does NOT
#   work on the Kata build the CoCo operator installs: it's silently
#   ignored, so CDH never contacts KBS and every fetch returns a 500.)
# - No decryption-key Secret volume is mounted. The consumer instead
#   fetches the key at KBS_RESOURCE_PATH from the in-guest CDH API at
#   127.0.0.1:8006, which only responds after the guest has passed
#   attestation against the KBS resource policy in kbs/resource-policy.rego.
#   See consumer/decrypt_and_load.py's fetch_key_from_kbs().
#
# ${HF_REPO_ID}, ${KBS_NAMESPACE} and ${CONSUMER_IMAGE} are substituted by
# scripts/deploy_consumer_pod.sh (run it as `scripts/deploy_consumer_pod.sh
# coco`) — don't apply this file directly with kubectl, it's a template.
apiVersion: v1
kind: Pod
metadata:
  name: confidential-model-consumer-coco
  labels:
    app: confidential-model-consumer-coco
  annotations:
    # Configures the attestation agent's key broker client. KBS_NAMESPACE
    # must match the namespace scripts/deploy_coco_kbs.sh actually deployed
    # KBS into (it prints this; defaults to coco-tenant, not the operator's
    # own confidential-containers-system namespace). The leading space in the
    # value is intentional: it's appended to the kernel command line.
    io.katacontainers.config.hypervisor.kernel_params: " agent.aa_kbc_params=cc_kbc::http://kbs.${KBS_NAMESPACE}.svc.cluster.local:8080"
spec:
  runtimeClassName: kata-qemu-coco-dev
  restartPolicy: Never
  containers:
    - name: consumer
      # The guest VM pulls this image itself (nydus snapshotter), so it must
      # be in a registry with publicly-trusted TLS that the guest can reach
      # without credentials — a local/minikube-loaded image name won't work.
      image: ${CONSUMER_IMAGE}
      imagePullPolicy: Always
      env:
        - name: HF_REPO_ID
          value: "${HF_REPO_ID}"
        - name: HF_REPO_TYPE
          value: "model"
        - name: HF_MODEL_ID
          value: "prajjwal1/bert-tiny"
        # Selects attested KBS/CDH key delivery instead of a mounted
        # Kubernetes Secret — must match the --path used with
        # scripts/push_key_to_kbs.sh.
        - name: KBS_RESOURCE_PATH
          value: "default/key/my-model"
        # Only needed if HF_REPO_ID is a private repo.
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-hub-token
              key: token
              optional: true
