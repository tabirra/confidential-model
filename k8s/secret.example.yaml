# Example/template only — do NOT put a real key in a file that gets committed.
#
# Prefer creating the Secret imperatively from the key file the producer
# wrote locally (see scripts/create_k8s_secret.sh):
#
#   kubectl create secret generic model-decryption-key \
#     --namespace default \
#     --from-file=key=secrets/decryption-key.b64
#
# This file only documents the shape of the resulting Secret.
apiVersion: v1
kind: Secret
metadata:
  name: model-decryption-key
  namespace: default
type: Opaque
stringData:
  key: "<base64-encoded-32-byte-AES-key produced by producer/encrypt_and_push.py>"
